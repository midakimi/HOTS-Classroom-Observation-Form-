</style></head><body>
<header>
  <div><h1>🎓 ระบบบันทึกผลการนิเทศการสอน · พัฒนาทักษะการคิดขั้นสูง (HOTS)</h1><small id="st">กำลังเชื่อมต่อ Google Sheets…</small></div>
  <div class="np" style="display:flex;gap:6px;align-items:center">
    <button id="roleBtn" style="font-size:12px;padding:4px 10px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)">สลับมุมมอง: ครู</button>
    <button id="syncBtn" style="font-size:12px;padding:4px 10px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)">🔄 ซิงก์</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const GAS_URL = "https://google.com";

const CloudDB = {
  listeners: [],
  cache: {},
  async syncAll() {
    setSt('🔄 กำลังซิงก์ข้อมูลออนไลน์…');
    try {
      const res = await fetch(GAS_URL + '?t=' + Date.now());
      const json = await res.json();
      if (json.status === 'success') {
        const map = {};
        (json.appData || []).forEach(row => {
          try {
            const c = row.collection;
            const obj = JSON.parse(row.json);
            if (!map[c]) map[c] = [];
            map[c].push(obj);
          } catch (e) {}
        });
        this.cache = map;
        localStorage.setItem('gs_cache', JSON.stringify(map));
        this.notify();
        setSt(SUP ? '🟢 เชื่อมต่อ Google Sheets · ซิงก์ออนไลน์แล้ว' : '🟢 โหมดครู · เชื่อมต่อ Google Sheets');
      }
    } catch (e) {
      try { this.cache = JSON.parse(localStorage.getItem('gs_cache') || '{}'); } catch (err) {}
      this.notify();
      setSt('🟠 ออฟไลน์ชั่วคราว (ใช้ข้อมูลแคชในเครื่อง)');
    }
  },
  notify() {
    this.listeners.forEach(({ c, fn }) => {
      const items = (this.cache[c] || []).map(d => ({ id: d.id, data: () => d }));
      fn({ docs: items });
    });
  },
  collection(c) {
    return {
      onSnapshot: (fn) => {
        this.listeners.push({ c, fn });
        const items = (this.cache[c] || []).map(d => ({ id: d.id, data: () => d }));
        fn({ docs: items });
      },
      doc: (id) => ({
        set: async (record) => {
          if (c === 'obs') {
            const cInfo = calc(record);
            record._avg = cInfo.tot.toFixed(2);
            record._hq = cInfo.hq.toFixed(0);
          }
          if (!this.cache[c]) this.cache[c] = [];
          this.cache[c] = this.cache[c].filter(x => x.id !== id);
          this.cache[c].unshift(record);
          localStorage.setItem('gs_cache', JSON.stringify(this.cache));
          this.notify();
          setSt('⏳ กำลังบันทึกลง Google Sheets…');
          await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'save', collection: c, id, record })
          });
          setSt('🟢 ซิงก์ออนไลน์เรียบร้อย');
        },
        delete: async () => {
          if (this.cache[c]) {
            this.cache[c] = this.cache[c].filter(x => x.id !== id);
            localStorage.setItem('gs_cache', JSON.stringify(this.cache));
            this.notify();
          }
          setSt('⏳ กำลังลบข้อมูลออนไลน์…');
          await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'delete', collection: c, id })
          });
          setSt('🟢 ซิงก์ออนไลน์เรียบร้อย');
        }
      })
    };
  },
  doc(path) {
    const parts = path.split('/');
    const id = parts.pop();
    const c = parts.join('/');
    return this.collection(c).doc(id);
  }
};

const TOOLS=[
{k:'A',n:'เครื่องมือ 1: การออกแบบและจัดกิจกรรมเพื่อ HOTS',it:['เป้าหมายการเรียนรู้ระบุระดับการคิดขั้นสูง (วิเคราะห์/ประเมิน/สร้างสรรค์)','กิจกรรมใช้สถานการณ์/ปัญหาจริงให้นักเรียนคิดวิเคราะห์','ให้นักเรียนลงมือปฏิบัติ สืบค้น หรือทดลองด้วยตนเอง','มีกิจกรรมกลุ่ม/ร่วมมือที่ทุกคนมีบทบาทชัดเจน','ใช้สื่อ/เทคโนโลยีสนับสนุนการคิดและสร้างสรรค์ชิ้นงาน','ขั้นตอนการสอนเชื่อมโยงความรู้เดิมสู่ความรู้ใหม่','จัดการเวลาให้นักเรียนมีเวลาคิดอย่างเพียงพอ','ปิดบทเรียนด้วยการสรุป/สะท้อนคิดของนักเรียน']},
{k:'B',n:'เครื่องมือ 2: คำถามและการกระตุ้นความคิด',it:['ใช้คำถามปลายเปิดที่มีได้หลายคำตอบ','ถามต่อเนื่อง “เพราะอะไร/มีหลักฐานอะไร”','รอคอยคำตอบ (Wait time) ≥ 3 วินาที','ไม่ตัดสินคำตอบทันที เปิดโอกาสให้เพื่อนโต้แย้ง/เสริม','กระตุ้นให้นักเรียนตั้งคำถามเอง','ปรับระดับคำถามให้ท้าทายตามศักยภาพผู้เรียน']},
{k:'C',n:'เครื่องมือ 3: พฤติกรรมการคิดขั้นสูงของนักเรียน',it:['วิเคราะห์ จำแนก เปรียบเทียบข้อมูลได้','ประเมินข้อมูล ให้เหตุผล ตัดสินใจโดยมีหลักฐาน','สร้างสรรค์ความคิด/ชิ้นงานใหม่ ไม่ซ้ำแบบเดิม','แก้ปัญหาอย่างเป็นขั้นตอนและทดลองหลายแนวทาง','อภิปราย โต้แย้ง และรับฟังความเห็นต่าง','เชื่อมโยงความรู้สู่ชีวิตจริง/ข้ามสาระ','สะท้อนคิดกระบวนการเรียนรู้ของตนเอง','นักเรียนมีส่วนร่วมอย่างทั่วถึง (≥ 80%)']},
{k:'D',n:'เครื่องมือ 4: การวัดประเมินผลและข้อมูลย้อนกลับ',it:['ใช้การประเมินตามสภาพจริง/ชิ้นงาน/Rubric','เกณฑ์การประเมินแจ้งนักเรียนชัดเจน','ให้ข้อมูลย้อนกลับที่ชี้แนะทางพัฒนา','เปิดโอกาสประเมินตนเองและเพื่อน']}];
const LV=['ไม่พบ','พบน้อย','พบบ่อย','พบสม่ำเสมอ'];
const BL=['จำ','เข้าใจ','ประยุกต์','วิเคราะห์','ประเมินค่า','สร้างสรรค์'];
const TY=[['wait','ครั้งที่ครูรอคอยคำตอบ ≥ 3 วินาที'],['sq','นักเรียนตั้งคำถามเอง'],['sr','นักเรียนตอบพร้อมให้เหตุผล/หลักฐาน'],['grp','ครั้งที่นักเรียนทำงานกลุ่ม/อภิปรายคู่']];
const $=s=>document.querySelector(s);const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DB=CloudDB,col=null,recs=[],view='form',cur=blank(),sel=null,teacherQ='';
function blank(){return{id:'o'+Date.now().toString(36),date:new Date().toISOString().slice(0,10),teacher:'',school:'',subject:'',grade:'',topic:'',observer:'',r:{},bl:new Array(6).fill(0),ty:{wait:0,sq:0,sr:0,grp:0},str:'',imp:'',act:'',ret:false,note:'',phase:'ก่อน',cyc:'1',ctx:{},tuid:''}}
function lsGet(){try{return JSON.parse(localStorage.getItem('sup')||'[]')}catch(e){return[]}}
function lsSet(){try{localStorage.setItem('sup',JSON.stringify(recs))}catch(e){}}
function render(){
  document.body.dataset.v=view;
  const NAV=SUP?[['form','📝 บันทึกนิเทศ'],['dash','📊 Dashboard'],['analytics','🧠 วิเคราะห์'],['work','🔄 CARE-HOTS'],['list','📋 รายการ'],['sched','📅 นัดโค้ช'],['plc','🤝 PLC'],['report','🗂️ รายงาน ว 11'],['teacher','👩‍🏫 ทะเบียนครู']]:[['teacher','👩‍🏫 ผลนิเทศของฉัน'],['plc','🤝 PLC']];
  document.querySelector('#nav').innerHTML=NAV.map(([k,t])=>'<button class="'+(view===k?'on':'')+'" data-v="'+k+'">'+t+'</button>').join('');
  document.querySelector('#nav').onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render();scrollTo(0,0)}};
  if(!SUP && view!=='plc')view='teacher';
  ({form:rForm,dash:rDash,list:rList,sched:rSched,teacher:rTeacher,analytics:rAnalytics,work:rWork,plc:rPlc,report:rReport})[view]();
}

function rForm(){
  cur.ctx=cur.ctx||{};cur.phase=cur.phase||'ก่อน';
  const f=(k,l,t='text')=>'<div><label>'+l+'<input type="'+t+'" data-f="'+k+'" value="'+E(cur[k])+'"></label></div>';
  const nums=[1,2,3,4];
  let html='<div class="card"><h2>ข้อมูลทั่วไป</h2><div class="g">'+f('date','วันที่นิเทศ','date')+f('observer','ศึกษานิเทศก์');
  html+='<div><label>ครูผู้รับการนิเทศ (เลือกจากรายชื่อหรือพิมพ์ใหม่)<input list="tlist" data-f="teacher" value="'+E(cur.teacher)+'" placeholder="พิมพ์ชื่อ หรือเลือกจากรายการ"><datalist id="tlist">'+roster.map(x=>'<option value="'+E(x.name)+'">'+E(x.school||'')+'</option>').join('')+'</datalist></label></div>';
  html+=f('school','โรงเรียน')+f('subject','กลุ่มสาระ/วิชา')+f('grade','ระดับชั้น')+f('topic','เรื่อง/แผนการสอน')+'</div></div>';
  html+='<div class="card"><h2>บริบทจริงและช่วงการนิเทศ</h2><div class="g"><label>ช่วงการนิเทศ<select data-f="phase">'+['ก่อน','ระหว่าง','หลัง'].map(x=>'<option value="'+x+'" '+(cur.phase===x?'selected':'')+'>'+(x==='ก่อน'?'ก่อนนิเทศ (Pre)':x==='ระหว่าง'?'ระหว่างติดตาม':'หลังนิเทศ (Post)')+'</option>').join('')+'</select></label>';
  html+='<label>รอบ/ภาคเรียน<input data-f="cyc" value="'+E(cur.cyc)+'"></label>';
  html+='<label>จำนวนนักเรียนในห้อง<input type="number" data-c="n" value="'+E(cur.ctx.n)+'"></label>';
  html+='<label>ทรัพยากร/อินเทอร์เน็ต<select data-c="res">'+['','พอเพียง','จำกัด','ขาดแคลน'].map(x=>'<option '+(cur.ctx.res===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label>';
  html+='<label>ภาระสอน (ชม./สัปดาห์)<input type="number" data-c="load" value="'+E(cur.ctx.load)+'"></label>';
  html+='<label>ข้อจำกัดอื่น (เช่น สอนควบชั้น)<input data-c="lim" value="'+E(cur.ctx.lim)+'"></label></div></div>';
  html+='<div class="card" style="position:sticky;top:52px;z-index:4"><b id="live"></b></div>';
  html+=TOOLS.map(T=>'<div class="card"><h2>'+T.n+'</h2><div class="mu">1 = ไม่พบ · 2 = พบน้อย · 3 = พบบ่อย · 4 = พบสม่ำเสมอ/เด่นชัด</div>'+T.it.map((x,i)=>'<div class="it"><div>'+T.k+(i+1)+'. '+E(x)+'</div><div class="sc">'+nums.map(n=>'<button data-k="'+T.k+i+'" data-n="'+n+'" class="'+(cur.r[T.k+i]==n?'on':'')+'">'+n+' '+LV.at(n-1)+'</button>').join('')+'</div></div>').join('')+'</div>').join('');
  html+='<div class="card"><h2>เครื่องมือ 5: บันทึกระดับคำถามของครู (Bloom)</h2><div class="mu">กดนับเมื่อครูถามคำถามแต่ละระดับ — ระดับ วิเคราะห์ ประเมินค่า สร้างสรรค์ = คำถามขั้นสูง</div>';
  html+=BL.map((b,i)=>'<div class="tl"><span style="width:90px">'+(i+1)+'. '+b+(i>2?' ★':'')+'</span><button data-b="'+i+'" data-d="-1">−</button><b>'+cur.bl.at(i)+'</b><button class="pri" data-b="'+i+'" data-d="1">+</button></div>').join('')+'</div>';
  html+='<div class="card"><h2>เครื่องมือ 6: บันทึกการปฏิสัมพันธ์ในชั้นเรียน</h2>'+TY.map(([k,l])=>'<div class="tl"><span style="flex:1">'+l+'</span><button data-t="'+k+'" data-d="-1">−</button><b>'+cur.ty[k]+'</b><button class="pri" data-t="'+k+'" data-d="1">+</button></div>').join('')+'</div>';
  html+='<div class="card"><h2>สรุปผลและข้อเสนอแนะ</h2><label>จุดเด่น<textarea data-f="str">'+E(cur.str)+'</textarea></label><label>ประเด็นที่ควรพัฒนา<textarea data-f="imp">'+E(cur.imp)+'</textarea></label><label>ข้อตกลง/แนวทางพัฒนาร่วมกัน (Action plan)<textarea data-f="act">'+E(cur.act)+'</textarea></label></div>';
  html+='<div class="card np" style="display:flex;gap:8px;flex-wrap:wrap"><button id="ai">✨ ร่างข้อเสนอแนะอัตโนมัติ</button> <button class="pri" id="sv">💾 บันทึกออนไลน์</button><button class="ok" id="rt">📤 บันทึกและส่งคืนครู (real-time)</button><button id="nw">+ เริ่มรายการใหม่</button></div>';
  
  const A=document.querySelector('#app');
  A.innerHTML=html;
  A.oninput=e=>{
    const t=e.target,k=t.dataset.f;
    if(k){
      cur[k]=t.value;
      if(k==='teacher'){
        const x=roster.find(r=>(r.name||'').trim()===t.value.trim());
        cur.tuid=x?x.id:'';
        if(x&&x.school){cur.school=x.school;A.querySelector('[data-f=school]').value=cur.school}
      }
    }
    if(t.dataset.c)cur.ctx[t.dataset.c]=t.value;
  };
  A.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(d.k){cur.r[d.k]=+d.n;[...A.querySelectorAll('[data-k="'+d.k+'"]')].forEach(x=>x.classList.toggle('on',x.dataset.n==d.n));live()}
    else if(d.b!==undefined){cur.bl[d.b]=Math.max(0,cur.bl.at(+d.b)+ +d.d);b.parentNode.querySelector('b').textContent=cur.bl.at(+d.b);live()}
    else if(d.t){cur.ty[d.t]=Math.max(0,cur.ty[d.t]+ +d.d);b.parentNode.querySelector('b').textContent=cur.ty[d.t]}
    else if(b.id==='ai')autoFB();
    else if(b.id==='sv')chk()&&save();
    else if(b.id==='rt'){if(chk()&&confirm('ส่งคืนผลการนิเทศให้ครู '+cur.teacher+' ?'))save(true)}
    else if(b.id==='nw'){cur=blank();render()}
  };
  live();
}

function chk(){
  if(!cur.tuid){const x=roster.find(r=>(r.name||'').trim()===cur.teacher.trim());if(x)cur.tuid=x.id}
  if(!cur.teacher.trim()){toast('กรุณาระบุชื่อครูผู้รับการนิเทศ');return false}
  const c=calc(cur);
  if(c.filled<TOOLS.reduce((a,t)=>a+t.it.length,0)&&!confirm('ยังประเมินไม่ครบทุกข้อ (ครบ '+c.filled+'/'+TOOLS.reduce((a,t)=>a+t.it.length,0)+') บันทึกต่อหรือไม่?'))return false;
  return true;
}

function live(){
  const c=calc(cur),n=TOOLS.reduce((a,t)=>a+t.it.length,0);
  document.querySelector('#live').innerHTML='คะแนนเฉลี่ย '+c.tot.toFixed(2)+'/4 · ระดับ <span class="tag">'+c.lvl+'</span> · ครบ '+c.filled+'/'+n+' ข้อ · คำถามขั้นสูง '+c.hq.toFixed(0)+'% ('+c.q+' คำถาม)';
}

function report(r){
  const c=calc(r);const fullName=r.teacher;
  return '<div id="rep"><h2 style="text-align:center;margin:0">รายงานผลการนิเทศการสอนเพื่อพัฒนาทักษะการคิดขั้นสูง</h2>'+
  '<p style="text-align:center;margin:2px 0 10px">วันที่ '+E(r.date)+' · ศึกษานิเทศก์: '+E(r.observer||'-')+'</p>'+
  '<table><tr><td>ครูผู้รับการนิเทศ: <b>'+E(r.teacher)+'</b></td><td>โรงเรียน: '+E(r.school||'-')+'</td></tr><tr><td>วิชา: '+E(r.subject||'-')+' ชั้น '+E(r.grade||'-')+'</td><td>เรื่อง: '+E(r.topic||'-')+'</td></tr></table>'+
  '<h3>สรุปผลภาพรวม: '+c.tot.toFixed(2)+' / 4.00 — ระดับ '+c.lvl+'</h3>'+
  bars(TOOLS.map(T=>[T.n.replace(/เครื่องมือ \d: /,''),c.t[T.k].m,c.t[T.k].m.toFixed(2)]),4)+
  '<h3>ระดับคำถามของครู (รวม '+c.q+' ข้อ, ขั้นสูง '+c.hq.toFixed(0)+'%)</h3>'+bars(BL.map((b,i)=>[b,r.bl.at(i),r.bl.at(i)]),Math.max(1,...r.bl))+
  '<h3>การปฏิสัมพันธ์</h3><table>'+TY.map(([k,l])=>'<tr><td>'+l+'</td><td>'+r.ty[k]+' ครั้ง</td></tr>').join('')+'</table>'+
  '<h3>รายข้อ (ข้อที่ได้คะแนน ≤ 2)</h3><ul>'+(TOOLS.flatMap(T=>T.it.map((x,i)=>[T.k+(i+1),x,+r.r[T.k+i]||0])).filter(x=>x.at(2)>0&&x.at(2)<=2).map(x=>'<li>'+x.at(0)+' '+E(x.at(1))+' ('+x.at(2)+')</li>').join('')||'<li>ไม่มี</li>')+'</ul>'+

}

const ST=['นัดแล้ว','เสร็จสิ้น','ยกเลิก'];
async function saveS(o){
  try{
    if(DB){await DB.collection('sched').doc(o.id).set(JSON.parse(JSON.stringify(o)));await mirror('s',o)}
    else{sched=sched.filter(x=>x.id!==o.id).concat(o).sort(byDT);localStorage.setItem('sch',JSON.stringify(sched))}
    toast('บันทึกนัดหมายออนไลน์แล้ว ✔');
  }catch(e){toast('ไม่สำเร็จ: '+(e.message||e.code||''))}
}

async function exportXlsx(){
  if(!window.XLSX)return toast('โหลดไลบรารี Excel ไม่สำเร็จ');
  const H=['วันที่','ครู','โรงเรียน','วิชา','ชั้น','เรื่อง','ศึกษานิเทศก์',...TOOLS.map(t=>'เฉลี่ย '+t.k),'เฉลี่ยรวม','ระดับ',...BL.map(b=>'คำถาม'+b),'% คำถามขั้นสูง',...TY.map(t=>t.at(1)),'สถานะ'];
  const A=[H,...recs.map(r=>{const c=calc(r);return[r.date,r.teacher,r.school,r.subject,r.grade,r.topic,r.observer,...TOOLS.map(t=>+c.t[t.k].m.toFixed(2)),+c.tot.toFixed(2),c.lvl,...r.bl,+c.hq.toFixed(0),...TY.map(t=>r.ty[t.at(0)]),r.ret?'ส่งคืนแล้ว':'ร่าง']})];
  const I=[['วันที่','ครู','ข้อ','ตัวชี้วัด','คะแนน'],...recs.flatMap(r=>TOOLS.flatMap(T=>T.it.map((x,i)=>[r.date,r.teacher,T.k+(i+1),x,+r.r[T.k+i]||''])))];
  const S=[['วันที่','เวลา','ครู','ช่องทาง','ประเด็น','สถานะ','G','R','O','W'],...sched.map(o=>[o.date,o.time,o.teacher,o.plat,o.focus,o.status,o.g,o.r,o.o,o.w])];
  const wb=XLSX.utils.book_new();
  [['สรุปการนิเทศ',A],['รายข้อ',I],['นัดโค้ชชิ่ง',S],['Pre-Post',ppRows()],['หลักฐาน-สะท้อนคิด',evRows()]].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
  XLSX.writeFile(wb,'supervision-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('ดาวน์โหลด Excel เรียบร้อย ✔');
}

function trend(){
  const tn=[...new Set(recs.map(r=>r.teacher))];
  const rs=recs.filter(r=>!tsel||r.teacher===tsel);
  const ds=[...new Set(rs.map(r=>r.date))].sort();
  const SR=[['รวม',c=>c.tot,'#2f5bd6'],...TOOLS.map((T,i)=>['เครื่องมือ '+T.k,c=>c.t[T.k].m,['#1f9d6b','#d98a0b','#d64545','#8a4fd6'].at(i)])];
  const W=640,H=230,P=34,X=i=>ds.length>1?P+i*(W-2*P)/(ds.length-1):W/2,Y=v=>H-P-v/4*(H-2*P);
  const nums=[1,2,3,4];
  const ln=SR.map(([n,f,col])=>{
    const pts=ds.map((d,i)=>{const v=rs.filter(r=>r.date===d).map(r=>f(calc(r))).filter(x=>x>0);return v.length?[X(i),Y(v.reduce((a,b)=>a+b)/v.length)]:null}).filter(Boolean);
    return'<polyline fill="none" stroke="'+col+'" stroke-width="'+(n==='รวม'?3:1.5)+'" points="'+pts.map(q=>q.join(',')).join(' ')+'"/>'+pts.map(q=>'<circle cx="'+q.at(0)+'" cy="'+q.at(1)+'" r="3" fill="'+col+'"/>').join('');
  }).join('');
  return'<div class="card"><h2>📈 แนวโน้มตามเวลา</h2><label>เลือกครู<select id="ts"><option value="">ทุกคน (เฉลี่ย)</option>'+tn.map(n=>'<option '+(n===tsel?'selected':'')+'>'+E(n)+'</option>').join('')+'</select></label><div class="sw"><svg viewBox="0 0 '+W+' '+H+'" style="min-width:420px;width:100%">'+nums.map(v=>'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)"/><text x="6" y="'+(Y(v)+4)+'" font-size="10" fill="var(--mu)">'+v+'</text>').join('')+ds.map((d,i)=>'<text x="'+X(i)+'" y="'+(H-10)+'" font-size="10" text-anchor="middle" fill="var(--mu)">'+d.slice(2)+'</text>').join('')+ln+'</svg></div><div class="mu">'+SR.map(([n,,c])=>'<span style="color:'+c+'">●</span> '+n).join(' &nbsp; ')+(ds.length<2?' · ต้องมีอย่างน้อย 2 วันที่เพื่อเห็นแนวโน้ม':'')+'</div></div>';
}
