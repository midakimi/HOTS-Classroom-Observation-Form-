<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบบันทึกการนิเทศเพื่อพัฒนาสมรรถนะการจัดการเรียนรู้สำหรับครูโรงเรียนเอกชนในระบบ - กลุ่มพัฒนาคุณภาพและมาตรฐานการศึกษา สำนักงานการศึกษาเอกชนจังหวัดนราธิวาส</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12303a;--mute:#5b727a;--sea:#0e5a6b;--sea2:#0a3f4c;--sun:#e8a317;--bg:#f2f6f6;--card:#fff;--line:#d3dfe1;--ok:#2f7d4f;--bad:#b3402f;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{background:var(--sea2);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:4px solid var(--sun)}
header h1{font-size:18px;margin:0;flex:1;min-width:220px;line-height:1.3}
header small{display:block;font-weight:400;opacity:.8;font-size:13px}
nav{display:flex;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--mute);font-weight:500}
nav button.on{background:var(--sea);color:#fff}
main{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
h2{margin:0 0 14px;font-size:22px}
h3{margin:18px 0 8px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--sea);background:var(--sea);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.alt{background:#fff;color:var(--sea)}
.btn.bad{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:14px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 3px;color:var(--sea2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-left:5px solid var(--sun);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:30px;line-height:1.1;color:var(--sea)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#e8f0f1;font-weight:600}
.wrap{overflow-x:auto}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#e8f0f1;color:var(--sea2)}
.tag.ok{background:#dcefe3;color:var(--ok)}.tag.warn{background:#fbecc6;color:#7a5400}.tag.bad{background:#f6dcd7;color:var(--bad)}
.bar{height:14px;background:#e8f0f1;border-radius:7px;overflow:hidden;min-width:100px}
.bar i{display:block;height:100%;background:var(--sea)}
.mute{color:var(--mute);font-size:14px}
.empty{padding:28px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:var(--r)}
.rub{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rub .opt{display:flex;gap:4px}
.rub .opt label{margin:0;display:flex;align-items:center;gap:4px;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
.rub .opt input{width:auto}
dialog{border:0;border-radius:14px;padding:20px;width:min(760px,94vw);max-height:92vh;box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0a3f4ca0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sea2);color:#fff;padding:10px 20px;border-radius:99px;display:none;z-index:99}
#toast.bad{background:var(--bad)}
.login{max-width:420px;margin:7vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;border-top:6px solid var(--sun)}
.seg{display:flex;border:1px solid var(--sea);border-radius:8px;overflow:hidden;margin:12px 0}
.seg button{flex:1;border:0;background:#fff;color:var(--sea);padding:8px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--sea);color:#fff}
.cm{border-left:3px solid var(--line);padding:2px 10px;margin:6px 0 6px 6px;font-size:15px}
@media print{header,nav,.noprint,#toast{display:none!important}body{background:#fff}dialog{box-shadow:none;width:100%;max-height:none}dialog::backdrop{display:none}main{padding:0}}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwh1UxoEBbksFJmxyYI_q97Uwit9CstoTBRt_cxyOHCdSovI-UgXsfIO0CLppuO6iwVkA/exec';
const RUBRIC = [
 'เป้าหมายการเรียนรู้ชัดเจน มุ่งพัฒนาการคิดขั้นสูง',
 'ตั้งคำถามกระตุ้นการวิเคราะห์ ประเมินค่า และสร้างสรรค์',
 'จัดกิจกรรมให้ผู้เรียนลงมือคิด แก้ปัญหา และทำงานร่วมกัน',
 'เชื่อมโยงเนื้อหากับสถานการณ์จริงและบริบทท้องถิ่น',
 'ให้ผู้เรียนอธิบายเหตุผลและใช้หลักฐานสนับสนุนความคิด',
 'ให้ข้อมูลป้อนกลับที่ช่วยให้ผู้เรียนคิดต่อ',
 'วัดและประเมินผลการคิดขั้นสูงอย่างเหมาะสม',
 'บรรยากาศส่งเสริมให้ผู้เรียนกล้าคิดและกล้าแสดงความเห็น'];
const BLOOM = ['จำ','เข้าใจ','ประยุกต์ใช้','วิเคราะห์','ประเมินค่า','สร้างสรรค์'];
const PHASE = ['ก่อนสังเกตการสอน','สังเกตการสอน','สะท้อนผลและโค้ช'];

let GAS = localStorage.getItem('gas') || DEFAULT_GAS_URL;
let S = JSON.parse(sessionStorage.getItem('s') || 'null'), D = {}, tab = '', q = '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = c => D[c] || [];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const fd = d => d ? new Date(d).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}) : '-';
const isSup = () => S && S.role === 'sup';
const myEv = () => 'evid/' + S.uid + '/items';
const nl = s => esc(s).replace(/\n/g, '<br>');

function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3200); }

async function api(b) {
  if (!GAS) throw Error('ยังไม่ได้ตั้งค่า URL ของ Web App');
  const r = await fetch(GAS, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...b, token: S && S.token})});
  const j = await r.json();
  if (j.code === 'unauthorized') { S = null; sessionStorage.removeItem('s'); render(); }
  if (j.status !== 'success') throw Error(j.message || 'เกิดข้อผิดพลาด');
  return j;
}
async function load() {
  const j = await api({action:'list'}); D = {};
  j.appData.forEach(x => { try { (D[x.collection] = D[x.collection] || []).push(JSON.parse(x.json)); } catch (e) {} });
}
async function save(c, r) {
  r.id = r.id || uid();
  await api({action:'save', collection:c, id:r.id, record:r});
  const a = D[c] = L(c), i = a.findIndex(x => x.id === r.id);
  i < 0 ? a.push(r) : a[i] = r; return r;
}
async function del(c, id) { await api({action:'delete', collection:c, id}); D[c] = L(c).filter(x => x.id !== id); }
async function run(fn, ok) {
  try { await fn(); if (ok) toast(ok); } catch (e) { toast(e.message, true); return false; }
  return true;
}

/* ---------- คำนวณคะแนน ---------- */
function calc(sc, qs) {
  const v = sc.filter(x => x > 0), avg = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
  const tot = qs.reduce((a, b) => a + b, 0), hq = tot ? (qs[3] + qs[4] + qs[5]) / tot * 100 : 0;
  return {avg: +avg.toFixed(2), hq: +hq.toFixed(1)};
}
const lvl = a => a >= 3.5 ? ['ดีเยี่ยม','ok'] : a >= 2.5 ? ['ดี','ok'] : a >= 1.5 ? ['พอใช้','warn'] : ['ควรปรับปรุง','bad'];
const lvTag = a => { const l = lvl(a); return `<span class="tag ${l[1]}">${a.toFixed(2)} ${l[0]}</span>`; };
const tmatch = (x, t) => x.tuid === t.id || String(x.teacher || '').trim() === t.name;

/* ---------- หน้าหลัก ---------- */
function render() {
  const app = $('#app');
  if (!S) return app.innerHTML = loginHTML();
  const tabs = isSup()
    ? [['dash','ภาพรวม'],['obs','บันทึกการนิเทศ'],['sched','นัดโค้ช'],['roster','รายชื่อครู'],['plc','ชุมชน PLC'],['evid','หลักฐานครู']]
    : [['obs','ผลการนิเทศของฉัน'],['sched','นัดโค้ช'],['plc','ชุมชน PLC'],['evid','หลักฐานของฉัน']];
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  app.innerHTML = `<header><h1>ระบบบันทึกการนิเทศเพื่อพัฒนาสมรรถนะการจัดการเรียนรู้สำหรับครูโรงเรียนเอกชนในระบบ<small>สังกัดสำนักงานการศึกษาเอกชนจังหวัดนราธิวาส</small></h1>
    <span>${esc(S.name)}</span><button class="btn alt sm" data-a="logout">ออกจากระบบ</button></header>
    <nav>${tabs.map(t => `<button data-a="tab" data-v="${t[0]}" class="${t[0] === tab ? 'on' : ''}">${t[1]}</button>`).join('')}</nav>
    <main>${({dash, obs, sched, roster, plc, evid})[tab]()}</main>`;
}
function loginHTML() {
return `<form class="login" data-f="login"><h2 style="text-align: center !important; width: 100%; display: block;">เข้าสู่ระบบ</h2>
  <div class="mute"><div style="text-align: center; padding: 24px 16px;">
  <p style="margin: 0; color: #52606d; font-size: 14px; line-height: 1.6;">
    <strong>ระบบบันทึกการนิเทศครูโรงเรียนเอกชนในระบบ</strong><br>
    <strong>สังกัดสำนักงานการศึกษาเอกชนจังหวัดนราธิวาส</strong>
  </p>
  </div>
<div class="seg">
</div>
  <div class="seg"><button type="button" data-a="role" data-v="sup" class="on">ศึกษานิเทศก์</button><button type="button" data-a="role" data-v="teacher">ครู</button></div>
  <input type="hidden" name="role" value="sup">
  <div id="lt" hidden><label>ชื่อผู้ใช้งาน</label><input name="name" autocomplete="username"><label>รหัสผ่าน</label><input name="pin" type="password" inputmode="numeric" autocomplete="current-password"></div>
  <div id="ls"><label>รหัสผ่าน</label><input name="password" type="password" autocomplete="current-password"></div>
  <div class="row" style="margin-top:16px"><button class="btn sp">เข้าสู่ระบบ</button><button type="button" class="btn alt" data-a="cfg" title="ตั้งค่า URL">⚙ ตั้งค่า</button></div></form>`;
}

/* ---------- ภาพรวม ---------- */
function dash() {
  const T = L('roster'), O = L('obs'), up = L('sched').filter(x => x.status !== 'เสร็จสิ้น' && x.status !== 'ยกเลิก' && x.date >= today());
  const by = {}; O.forEach(x => (by[x.school || '-'] = by[x.school || '-'] || []).push(x._avg || 0));
  const rows = T.map(t => {
    const o = O.filter(x => tmatch(x, t)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const f = o[0], l = o[o.length - 1];
    return `<tr><td>${esc(t.name)}<div class="mute">${esc(t.school)}</div></td><td>${o.length}</td><td>${l ? lvTag(l._avg) : '<span class="tag warn">ยังไม่นิเทศ</span>'}</td>
      <td>${l ? l._hq + '%' + (o.length > 1 ? ` <span class="mute">(จาก ${f._hq}%)</span>` : '') : '-'}</td></tr>`;
  }).join('');
  return `<h2>ภาพรวม</h2><div class="stats">
   <div class="stat"><b>${T.length}</b>ครูในระบบ</div><div class="stat"><b>${O.length}</b>ครั้งที่นิเทศ</div>
   <div class="stat"><b>${O.filter(x => x.ret).length}</b>ส่งผลคืนครูแล้ว</div><div class="stat"><b>${up.length}</b>นัดโค้ชที่จะถึง</div></div>
   <div class="card"><h3 style="margin-top:0">คะแนนเฉลี่ยรายโรงเรียน (เต็ม 4)</h3>${Object.keys(by).length ? Object.entries(by).map(([s, a]) => { const m = a.reduce((x, y) => x + y, 0) / a.length;
     return `<div class="row" style="margin:6px 0"><span style="width:200px">${esc(s)}</span><div class="bar sp"><i style="width:${m / 4 * 100}%"></i></div><b>${m.toFixed(2)}</b></div>`; }).join('') : '<div class="empty">ยังไม่มีผลการนิเทศ เริ่มที่แท็บ “บันทึกการนิเทศ”</div>'}</div>
   <div class="card wrap"><h3 style="margin-top:0">ความก้าวหน้ารายครู</h3><table><tr><th>ครู</th><th>ครั้ง</th><th>คะแนนล่าสุด</th><th>คำถามขั้นสูง</th></tr>${rows || '<tr><td colspan="4" class="mute">เพิ่มรายชื่อครูที่แท็บ “รายชื่อครู”</td></tr>'}</table></div>`;
}

/* ---------- การนิเทศ ---------- */
function obs() {
  let O = L('obs').slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (q) O = O.filter(x => (x.teacher + x.school + x.subject).includes(q));
  const body = O.map(r => `<tr><td>${fd(r.date)}</td><td>${esc(r.teacher)}<div class="mute">${esc(r.school)}</div></td><td>${esc(r.subject)}<div class="mute">${esc(r.phase)}</div></td>
   <td>${lvTag(r._avg || 0)}</td><td>${r._hq ?? 0}%</td>${isSup() ? `<td>${r.ret ? '<span class="tag ok">ส่งแล้ว</span>' : '<span class="tag">ร่าง</span>'}</td>` : ''}
   <td class="row"><button class="btn alt sm" data-a="vobs" data-id="${r.id}">ดู</button>${isSup() ? `<button class="btn alt sm" data-a="eobs" data-id="${r.id}">แก้ไข</button><button class="btn alt sm" data-a="ret" data-id="${r.id}">${r.ret ? 'ถอนคืน' : 'ส่งคืนครู'}</button><button class="btn bad sm" data-a="dobs" data-id="${r.id}">ลบ</button>` : ''}</td></tr>`).join('');
  return `<h2>${isSup() ? 'บันทึกการนิเทศ' : 'ผลการนิเทศของฉัน'}</h2><div class="row noprint" style="margin-bottom:12px">
   <input id="q" value="${esc(q)}" placeholder="ค้นหาชื่อครู โรงเรียน วิชา" style="max-width:280px"><span class="sp"></span>
   ${isSup() ? '<button class="btn alt" data-a="csv">ส่งออก CSV</button><button class="btn" data-a="nobs">+ บันทึกการนิเทศ</button>' : ''}</div>
   ${O.length ? `<div class="card wrap"><table><tr><th>วันที่</th><th>ครู</th><th>วิชา/ช่วง</th><th>คะแนน</th><th>คำถามขั้นสูง</th>${isSup() ? '<th>สถานะ</th>' : ''}<th></th></tr>${body}</table></div>`
    : `<div class="empty">${isSup() ? 'ยังไม่มีบันทึก กด “+ บันทึกการนิเทศ” เพื่อเริ่ม' : 'ยังไม่มีผลการนิเทศที่ ศน. ส่งคืน'}</div>`}`;
}
function obsForm(r = {}) {
  const T = L('roster'), sc = r.scores || [], qs = r.q || [];
  return `<form data-f="obs"><h2>${r.id ? 'แก้ไข' : 'บันทึก'}การนิเทศ</h2><input type="hidden" name="id" value="${esc(r.id)}">
  <div class="g2"><div><label>ครูผู้รับการนิเทศ</label><select name="tuid" required><option value="">เลือกครู</option>${T.map(t => `<option value="${esc(t.id)}" ${r.tuid === t.id ? 'selected' : ''}>${esc(t.name)} (${esc(t.school)})</option>`).join('')}</select></div>
  <div><label>วันที่</label><input type="date" name="date" value="${r.date || today()}" required></div>
  <div><label>วิชา / กลุ่มสาระ</label><input name="subject" value="${esc(r.subject)}" required></div>
  <div><label>ระดับชั้น</label><input name="grade" value="${esc(r.grade)}"></div>
  <div><label>ช่วงการนิเทศ</label><select name="phase">${PHASE.map(p => `<option ${r.phase === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
  <div><label>เรื่อง / หน่วยการเรียนรู้</label><input name="topic" value="${esc(r.topic)}"></div></div>
  <h3>ประเมินการจัดการเรียนรู้เชิง HOTS (1 = ควรปรับปรุง … 4 = ดีเยี่ยม)</h3>
  ${RUBRIC.map((t, i) => `<div class="rub"><span>${i + 1}. ${t}</span><span class="opt">${[1,2,3,4].map(n => `<label><input type="radio" name="s${i}" value="${n}" ${sc[i] === n ? 'checked' : ''}>${n}</label>`).join('')}</span></div>`).join('')}
  <h3>จำนวนคำถามของครูตามระดับการคิด (บลูม)</h3><div class="g2">${BLOOM.map((b, i) => `<div><label>${b}${i > 2 ? ' (ขั้นสูง)' : ''}</label><input type="number" min="0" name="q${i}" value="${qs[i] || 0}"></div>`).join('')}</div>
  <h3>การโค้ช (GROW)</h3>
  <label>จุดเด่นที่พบ</label><textarea name="strengths">${esc(r.strengths)}</textarea>
  <label>เป้าหมาย (Goal)</label><textarea name="goal">${esc(r.goal)}</textarea>
  <label>สภาพที่เป็นอยู่ (Reality)</label><textarea name="reality">${esc(r.reality)}</textarea>
  <label>ทางเลือก / แนวทางพัฒนา (Options)</label><textarea name="options">${esc(r.options)}</textarea>
  <label>ข้อตกลงที่จะทำ (Will)</label><textarea name="will">${esc(r.will)}</textarea>
  <div class="g2"><div><label>นัดติดตามครั้งถัดไป</label><input type="date" name="next" value="${r.next || ''}"></div>
  <div><label>การส่งผลให้ครู</label><select name="ret"><option value="0">ยังไม่ส่ง (ร่าง)</option><option value="1" ${r.ret ? 'selected' : ''}>ส่งคืนครูให้เห็นผล</option></select></div></div>
  <div class="row" style="margin-top:16px"><button class="btn">บันทึก</button><button type="button" class="btn alt" data-a="close">ยกเลิก</button></div></form>`;
}
function obsView(r) {
  return `<div class="noprint row" style="margin-bottom:8px"><button class="btn" data-a="print">พิมพ์ / บันทึก PDF</button><button class="btn alt" data-a="close">ปิด</button></div>
  <h2>รายงานผลการนิเทศ HOTS</h2><p>ครู: <b>${esc(r.teacher)}</b> · ${esc(r.school)}<br>วิชา: ${esc(r.subject)} ${esc(r.grade)} · เรื่อง: ${esc(r.topic) || '-'}<br>วันที่ ${fd(r.date)} · ${esc(r.phase)}</p>
  <div class="stats"><div class="stat"><b>${(r._avg || 0).toFixed(2)}</b>คะแนนเฉลี่ย ${lvl(r._avg || 0)[0]}</div><div class="stat"><b>${r._hq || 0}%</b>คำถามขั้นสูง</div></div>
  <table>${RUBRIC.map((t, i) => `<tr><td>${i + 1}. ${t}</td><td><b>${(r.scores || [])[i] || '-'}</b></td></tr>`).join('')}</table>
  <table style="margin-top:10px"><tr>${BLOOM.map(b => `<th>${b}</th>`).join('')}</tr><tr>${BLOOM.map((b, i) => `<td>${(r.q || [])[i] || 0}</td>`).join('')}</tr></table>
  ${[['strengths','จุดเด่น'],['goal','เป้าหมาย (Goal)'],['reality','สภาพที่เป็นอยู่ (Reality)'],['options','แนวทางพัฒนา (Options)'],['will','ข้อตกลง (Will)']].map(([k, t]) => r[k] ? `<h3>${t}</h3><p>${nl(r[k])}</p>` : '').join('')}
  ${r.next ? `<p><b>นัดติดตาม:</b> ${fd(r.next)}</p>` : ''}`;
}

/* ---------- นัดโค้ช ---------- */
function sched() {
  const A = L('sched').slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  return `<h2>นัดโค้ช</h2>${isSup() ? '<div class="row noprint" style="margin-bottom:12px"><span class="sp"></span><button class="btn" data-a="nsch">+ นัดหมาย</button></div>' : ''}
  ${A.length ? `<div class="card wrap"><table><tr><th>วันที่</th><th>เวลา</th><th>ครู</th><th>หัวข้อ/สถานที่</th><th>สถานะ</th>${isSup() ? '<th></th>' : ''}</tr>${A.map(x => `<tr><td>${fd(x.date)}</td><td>${esc(x.time)}</td><td>${esc(x.teacher)}</td><td>${esc(x.topic)}<div class="mute">${esc(x.place)}</div></td>
   <td><span class="tag ${x.status === 'เสร็จสิ้น' ? 'ok' : x.status === 'ยกเลิก' ? 'bad' : 'warn'}">${esc(x.status)}</span></td>
   ${isSup() ? `<td class="row"><button class="btn alt sm" data-a="esch" data-id="${x.id}">แก้ไข</button><button class="btn bad sm" data-a="dsch" data-id="${x.id}">ลบ</button></td>` : ''}</tr>`).join('')}</table></div>` : '<div class="empty">ยังไม่มีนัดโค้ช</div>'}`;
}
function schForm(r = {}) {
  return `<form data-f="sched"><h2>${r.id ? 'แก้ไข' : 'เพิ่ม'}นัดโค้ช</h2><input type="hidden" name="id" value="${esc(r.id)}">
  <label>ครู</label><select name="tuid" required><option value="">เลือกครู</option>${L('roster').map(t => `<option value="${esc(t.id)}" ${r.tuid === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
  <div class="g2"><div><label>วันที่</label><input type="date" name="date" value="${r.date || today()}" required></div><div><label>เวลา</label><input type="time" name="time" value="${r.time || '09:00'}"></div></div>
  <label>หัวข้อ</label><input name="topic" value="${esc(r.topic)}"><label>สถานที่ / ลิงก์ประชุม</label><input name="place" value="${esc(r.place)}">
  <label>สถานะ</label><select name="status">${['นัดหมาย','เสร็จสิ้น','ยกเลิก'].map(s => `<option ${r.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
  <div class="row" style="margin-top:16px"><button class="btn">บันทึก</button><button type="button" class="btn alt" data-a="close">ยกเลิก</button></div></form>`;
}

/* ---------- รายชื่อครู ---------- */
function roster() {
  const T = L('roster');
  return `<h2>รายชื่อครู</h2><div class="row noprint" style="margin-bottom:12px"><span class="mute sp">ครูใช้ชื่อ-นามสกุล และรหัสผ่านที่กำหนดไว้เพื่อเข้าสู่ระบบ</span><button class="btn" data-a="nros">+ เพิ่มครู</button></div>
  ${T.length ? `<div class="card wrap"><table><tr><th>ชื่อ-สกุล</th><th>โรงเรียน</th><th>วิชา</th><th>รหัสผ่าน</th><th></th></tr>${T.map(t => `<tr><td>${esc(t.name)}</td><td>${esc(t.school)}</td><td>${esc(t.subject)}</td><td>${esc(t.pin)}</td>
   <td class="row"><button class="btn alt sm" data-a="eros" data-id="${t.id}">แก้ไข</button><button class="btn bad sm" data-a="dros" data-id="${t.id}">ลบ</button></td></tr>`).join('')}</table></div>` : '<div class="empty">ยังไม่มีรายชื่อครู กด “+ เพิ่มครู”</div>'}`;
}
function rosForm(r = {}) {
  return `<form data-f="roster"><h2>${r.id ? 'แก้ไข' : 'เพิ่ม'}ครู</h2><input type="hidden" name="id" value="${esc(r.id)}">
  <label>ชื่อ-สกุล</label><input name="name" value="${esc(r.name)}" required><label>โรงเรียน</label><input name="school" value="${esc(r.school)}" required>
  <label>วิชา / กลุ่มสาระ</label><input name="subject" value="${esc(r.subject)}"><label>รหัสผ่านเพื่อเข้าสู่ระบบ (อย่างน้อย 4 หลัก)</label><input name="pin" value="${esc(r.pin)}" minlength="4" required>
  <div class="row" style="margin-top:16px"><button class="btn">บันทึก</button><button type="button" class="btn alt" data-a="close">ยกเลิก</button></div></form>`;
}

/* ---------- PLC ---------- */
function plc() {
  const P = L('plc').slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return `<h2>ชุมชนแห่งการเรียนรู้ทางวิชาชีพ (PLC)</h2><form class="card noprint" data-f="plc"><label>แบ่งปันแนวปฏิบัติ / ตั้งคำถาม</label>
  <input name="title" placeholder="หัวข้อ" required style="margin-bottom:6px"><textarea name="body" placeholder="รายละเอียด เช่น กิจกรรมที่ได้ผล ปัญหาที่พบ" required></textarea><button class="btn" style="margin-top:8px">โพสต์</button></form>
  ${P.length ? P.map(p => `<div class="card"><div class="row"><b class="sp">${esc(p.title)}</b>${isSup() || p.uid === S.uid ? `<button class="btn bad sm" data-a="dplc" data-id="${p.id}">ลบ</button>` : ''}</div>
   <div class="mute">${esc(p.name || 'ศึกษานิเทศก์')} · ${fd(p.date)}</div><p>${nl(p.body)}</p>
   ${L('plccm').filter(c => c.pid === p.id).sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(c => `<div class="cm"><b>${esc(c.name || 'ศึกษานิเทศก์')}</b> ${nl(c.text)}${isSup() || c.uid === S.uid ? ` <a href="#" data-a="dcm" data-id="${c.id}" class="mute">ลบ</a>` : ''}</div>`).join('')}
   <form class="row noprint" data-f="cm" style="margin-top:8px"><input type="hidden" name="pid" value="${p.id}"><input name="text" placeholder="แสดงความเห็น" class="sp" required style="flex:1"><button class="btn alt sm">ส่ง</button></form></div>`).join('') : '<div class="empty">ยังไม่มีโพสต์ เริ่มแบ่งปันเป็นคนแรก</div>'}`;
}

/* ---------- หลักฐาน ---------- */
function evid() {
  const items = isSup() ? Object.keys(D).filter(k => k.startsWith('evid/')).flatMap(k => L(k).map(x => ({...x, _t: k.split('/')[1]}))) : L(myEv());
  items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const nameOf = id => (L('roster').find(t => t.id === id) || {}).name || '';
  return `<h2>${isSup() ? 'หลักฐานการพัฒนาของครู' : 'หลักฐานของฉัน'}</h2>${isSup() ? '' : '<div class="row noprint" style="margin-bottom:12px"><span class="sp mute">แนบลิงก์แผนการสอน ภาพกิจกรรม หรือผลงานนักเรียน (Google Drive ฯลฯ)</span><button class="btn" data-a="nev">+ เพิ่มหลักฐาน</button></div>'}
  ${items.length ? items.map(x => `<div class="card"><div class="row"><b class="sp">${esc(x.title)}</b><span class="tag">${esc(x.type)}</span>${!isSup() || true ? `<button class="btn bad sm" data-a="dev" data-id="${x.id}" data-t="${esc(x._t || S.uid)}">ลบ</button>` : ''}</div>
   <div class="mute">${isSup() ? esc(nameOf(x._t)) + ' · ' : ''}${fd(x.date)}</div>${x.note ? `<p>${nl(x.note)}</p>` : ''}${/^https?:\/\//.test(x.link || '') ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">เปิดลิงก์หลักฐาน</a>` : ''}</div>`).join('') : '<div class="empty">ยังไม่มีหลักฐาน</div>'}`;
}
function evForm() {
  return `<form data-f="ev"><h2>เพิ่มหลักฐาน</h2><label>ชื่อหลักฐาน</label><input name="title" required>
  <div class="g2"><div><label>ประเภท</label><select name="type"><option>แผนการสอน</option><option>ภาพกิจกรรม</option><option>ผลงานนักเรียน</option><option>บันทึกหลังสอน</option><option>อื่น ๆ</option></select></div><div><label>วันที่</label><input type="date" name="date" value="${today()}"></div></div>
  <label>ลิงก์ (https://...)</label><input name="link" type="url"><label>บันทึกเพิ่มเติม</label><textarea name="note"></textarea>
  <div class="row" style="margin-top:16px"><button class="btn">บันทึก</button><button type="button" class="btn alt" data-a="close">ยกเลิก</button></div></form>`;
}

/* ---------- เหตุการณ์ ---------- */
const dlg = $('#dlg');
const open = h => { dlg.innerHTML = h; dlg.showModal(); };
const find = (c, id) => L(c).find(x => x.id === id);
const csvEsc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
const refresh = async () => { await run(load); render(); };

const A = {
  tab: el => { tab = el.dataset.v; q = ''; render(); },
  role: el => { const sup = el.dataset.v === 'sup'; document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b === el));
    document.querySelector('[name=role]').value = el.dataset.v; $('#lt').hidden = sup; $('#ls').hidden = !sup; },
  cfg: () => { const u = prompt('วาง URL ของ Web App (ลงท้ายด้วย /exec)', GAS); if (u !== null) { GAS = u.trim(); localStorage.setItem('gas', GAS); toast('บันทึก URL แล้ว'); } },
  logout: async () => { try { await api({action:'logout'}); } catch (e) {} S = null; D = {}; sessionStorage.removeItem('s'); render(); },
  close: () => dlg.close(),
  print: () => window.print(),
  nobs: () => open(obsForm()), eobs: el => open(obsForm(find('obs', el.dataset.id))), vobs: el => open(obsView(find('obs', el.dataset.id))),
  ret: async el => { const r = find('obs', el.dataset.id); if (await run(() => save('obs', {...r, ret: !r.ret}), r.ret ? 'ถอนคืนแล้ว' : 'ส่งผลคืนครูแล้ว')) render(); },
  dobs: async el => { if (confirm('ลบบันทึกนี้?') && await run(() => del('obs', el.dataset.id), 'ลบแล้ว')) render(); },
  nsch: () => open(schForm()), esch: el => open(schForm(find('sched', el.dataset.id))),
  dsch: async el => { if (confirm('ลบนัดนี้?') && await run(() => del('sched', el.dataset.id), 'ลบแล้ว')) render(); },
  nros: () => open(rosForm()), eros: el => open(rosForm(find('roster', el.dataset.id))),
  dros: async el => { if (confirm('ลบครูคนนี้?') && await run(() => del('roster', el.dataset.id), 'ลบแล้ว')) render(); },
  dplc: async el => { if (confirm('ลบโพสต์นี้?') && await run(async () => { for (const c of L('plccm').filter(c => c.pid === el.dataset.id)) await del('plccm', c.id); await del('plc', el.dataset.id); }, 'ลบแล้ว')) render(); },
  dcm: async el => { if (await run(() => del('plccm', el.dataset.id))) render(); },
  nev: () => open(evForm()),
  dev: async el => { const c = 'evid/' + el.dataset.t + '/items'; if (confirm('ลบหลักฐานนี้?') && await run(() => del(c, el.dataset.id), 'ลบแล้ว')) render(); },
  csv: () => {
    const h = ['วันที่','ครู','โรงเรียน','วิชา','ช่วง','คะแนนเฉลี่ย','% คำถามขั้นสูง','ส่งคืนครู'];
    const rows = L('obs').map(r => [r.date, r.teacher, r.school, r.subject, r.phase, r._avg, r._hq, r.ret ? 'ใช่' : 'ไม่']);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + [h, ...rows].map(r => r.map(csvEsc).join(',')).join('\n')], {type:'text/csv'}));
    a.download = 'สรุปนิเทศ-' + today() + '.csv'; a.click();
  }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) return; e.preventDefault(); A[el.dataset.a] && A[el.dataset.a](el); });
document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value.trim(); const p = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); } });

const F = {
  login: async f => {
    const b = Object.fromEntries(f);
    if (await run(async () => { const j = await api({action:'login', ...b}); S = {token:j.token, role:j.role, uid:j.uid, name:j.name}; sessionStorage.setItem('s', JSON.stringify(S)); await load(); })) render();
  },
  obs: async (f, form) => {
    const t = find('roster', f.get('tuid')), old = find('obs', f.get('id')) || {};
    const scores = RUBRIC.map((_, i) => +f.get('s' + i) || 0), qs = BLOOM.map((_, i) => +f.get('q' + i) || 0), c = calc(scores, qs);
    if (scores.some(x => !x)) return toast('กรุณาประเมินให้ครบทุกข้อ', true);
    const r = {...old, id: f.get('id') || undefined, tuid: t.id, teacher: t.name, school: t.school, date: f.get('date'), subject: f.get('subject'), grade: f.get('grade'), phase: f.get('phase'), topic: f.get('topic'),
      scores, q: qs, _avg: c.avg, _hq: c.hq, strengths: f.get('strengths'), goal: f.get('goal'), reality: f.get('reality'), options: f.get('options'), will: f.get('will'), next: f.get('next'), ret: f.get('ret') === '1'};
    if (await run(() => save('obs', r), 'บันทึกแล้ว')) { dlg.close(); render(); }
  },
  sched: async f => {
    const t = find('roster', f.get('tuid')), r = {id: f.get('id') || undefined, tuid: t.id, teacher: t.name, date: f.get('date'), time: f.get('time'), topic: f.get('topic'), place: f.get('place'), status: f.get('status')};
    if (await run(() => save('sched', r), 'บันทึกแล้ว')) { dlg.close(); render(); }
  },
  roster: async f => {
    const r = {id: f.get('id') || undefined, name: f.get('name').trim(), school: f.get('school').trim(), subject: f.get('subject'), pin: f.get('pin').trim()};
    if (L('roster').some(x => x.name === r.name && x.id !== r.id)) return toast('มีชื่อนี้อยู่แล้ว', true);
    if (await run(() => save('roster', r), 'บันทึกแล้ว')) { dlg.close(); render(); }
  },
  plc: async f => { if (await run(() => save('plc', {title: f.get('title'), body: f.get('body'), date: today(), uid: S.uid, name: S.name}), 'โพสต์แล้ว')) render(); },
  cm: async f => { if (await run(() => save('plccm', {pid: f.get('pid'), text: f.get('text'), date: new Date().toISOString(), uid: S.uid, name: S.name}))) render(); },
  ev: async f => { if (await run(() => save(myEv(), {title: f.get('title'), type: f.get('type'), date: f.get('date'), link: f.get('link'), note: f.get('note')}), 'บันทึกแล้ว')) { dlg.close(); render(); } }
};
document.addEventListener('submit', e => { const f = e.target.dataset.f; if (!f) return; e.preventDefault(); const b = e.submitter; if (b) b.disabled = true; Promise.resolve(F[f](new FormData(e.target), e.target)).finally(() => { if (b) b.disabled = false; }); });

if (S) { render(); refresh(); } else render();
</script>
<footer style="text-align: center; padding: 24px 16px; margin-top: 32px; color: #64748b; font-size: 13px; border-top: 1px solid #e2e8f0; line-height: 1.6;">
  พัฒนาโดย: <strong>นางสาวฮานีดา เมาะมิง</strong> <br> ตำแหน่งศึกษานิเทศก์ วิทยฐานะศึกษานิเทศก์ชำนาญการพิเศษ <br>
  กลุ่มงานพัฒนาคุณภาพและมาตรฐานการศึกษา สำนักงานการศึกษาเอกชนจังหวัดนราธิวาส
</footer>
</footer>

</body>
</html>
