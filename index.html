const GAS_URL = "https://google.com";

/* ---- ตัวเชื่อมต่อ Google Sheets Cloud Adapter ---- */
const CloudDB = {
  listeners: [],
  cache: {},
  async syncAll() {
    setSt('🔄 กำลังซิงก์ข้อมูลออนไลน์…');
    try {
      const res = await fetch(GAS_URL + '?t=' + Date.now());
      const json = await res.json();
      if (json.status === 'success') {
        const map = {};
        (json.appData || []).forEach(row => {
          try {
            const c = row.collection;
            const obj = JSON.parse(row.json);
            if (!map[c]) map[c] = [];
            map[c].push(obj);
          } catch (e) {}
        });
        this.cache = map;
        localStorage.setItem('gs_cache', JSON.stringify(map));
        this.notify();
        setSt(SUP ? '🟢 เชื่อมต่อ Google Sheets · ซิงก์ออนไลน์แล้ว' : '🟢 โหมดครู · เชื่อมต่อ Google Sheets');
      }
    } catch (e) {
      try { this.cache = JSON.parse(localStorage.getItem('gs_cache') || '{}'); } catch (err) {}
      this.notify();
      setSt('🟠 ออฟไลน์ชั่วคราว (ใช้ข้อมูลแคชในเครื่อง)');
    }
  },
  notify() {
    this.listeners.forEach(({ c, fn }) => {
      const items = (this.cache[c] || []).map(d => ({ id: d.id, data: () => d }));
      fn({ docs: items });
    });
  },
  collection(c) {
    return {
      onSnapshot: (fn) => {
        this.listeners.push({ c, fn });
        const items = (this.cache[c] || []).map(d => ({ id: d.id, data: () => d }));
        fn({ docs: items });
      },
      doc: (id) => ({
        set: async (record) => {
          if (c === 'obs') {
            const cInfo = calc(record);
            record._avg = cInfo.tot.toFixed(2);
            record._hq = cInfo.hq.toFixed(0);
          }
          if (!this.cache[c]) this.cache[c] = [];
          this.cache[c] = this.cache[c].filter(x => x.id !== id);
          this.cache[c].unshift(record);
          localStorage.setItem('gs_cache', JSON.stringify(this.cache));
          this.notify();
          setSt('⏳ กำลังบันทึกลง Google Sheets…');
          await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'save', collection: c, id, record })
          });
          setSt('🟢 ซิงก์ออนไลน์เรียบร้อย');
        },
        delete: async () => {
          if (this.cache[c]) {
            this.cache[c] = this.cache[c].filter(x => x.id !== id);
            localStorage.setItem('gs_cache', JSON.stringify(this.cache));
            this.notify();
          }
          setSt('⏳ กำลังลบข้อมูลออนไลน์…');
          await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'delete', collection: c, id })
          });
          setSt('🟢 ซิงก์ออนไลน์เรียบร้อย');
        }
      })
    };
  },
  doc(path) {
    const parts = path.split('/');
    const id = parts.pop();
    const c = parts.join('/');
    return this.collection(c).doc(id);
  }
};
